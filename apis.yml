name: Ethonai
description: >-
  EthonAI AG is an ETH Zurich spin-off (founded 2021, Zurich, Switzerland) that
  builds an Industrial AI Platform — the Manufacturing Analytics System (MAS).
  It applies Causal AI through a no-code platform so manufacturing engineers can
  move from reactive dashboards to prescriptive quality and process analytics,
  deploying models to production in hours. The platform ships as Analyst,
  Inspector, and Operator modules, is cloud-agnostic (AWS, GCP, Azure), and is
  API-first: data flows in and out via a REST API, MQTT streaming, and a Python
  SDK for notebooks and custom applications. EthonAI is used by manufacturers
  including Siemens, Bosch, Roche, and Lindt & Sprüngli, is part of the Siemens
  Xcelerator ecosystem, and is backed by Index Ventures, General Catalyst,
  Earlybird, and Founderful. It does not publish a public API reference or
  developer portal; its API and SDK are documented inside the authenticated
  product.
